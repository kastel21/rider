{% extends "base.html" %}
{% block title %}Delete bike{% endblock %}
{% block content %}
<div class="card">
  <h1>Delete bike</h1>
  <p>Delete <strong>{{ bike.code }}</strong>? If this bike is used on weekly reports, it will be deactivated instead of removed.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-dash">Confirm</button>
    <a href="{% url 'operations:pc_manage_bikes' %}" class="btn-dash">Cancel</a>
  </form>
</div>
{% endblock %}
