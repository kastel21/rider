{% extends "base.html" %}
{% block title %}Delete vehicle{% endblock %}
{% block content %}
<div class="card">
  <h1>Delete vehicle</h1>
  <p>Delete <strong>{{ car.code }}</strong>? If this vehicle is used on weekly reports or assigned to a driver, it will be deactivated instead of removed.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-dash">Confirm</button>
    <a href="{% url 'operations:pc_manage_cars' %}" class="btn-dash">Cancel</a>
  </form>
</div>
{% endblock %}
