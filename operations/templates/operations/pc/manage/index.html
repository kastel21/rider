{% extends "base.html" %}
{% block title %}Manage data{% endblock %}
{% block content %}
<div class="card">
  <h1>Manage data</h1>
  <p class="muted" style="margin:0 0 1rem;font-size:0.92rem;">
    Bikes, cars (driver vehicles), facilities, hubs, riders, and drivers in your assigned provinces and districts.
  </p>
  <ul class="pc-manage-tiles" style="list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:0.75rem;">
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_bikes' %}" style="display:block;text-align:center;padding:1rem;">Bikes</a></li>
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_cars' %}" style="display:block;text-align:center;padding:1rem;">Vehicles</a></li>
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_facilities' %}" style="display:block;text-align:center;padding:1rem;">Facilities</a></li>
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_hubs' %}" style="display:block;text-align:center;padding:1rem;">Hubs</a></li>
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_riders' %}" style="display:block;text-align:center;padding:1rem;">Riders</a></li>
    <li><a class="btn-dash btn-dash-primary" href="{% url 'operations:pc_manage_drivers' %}" style="display:block;text-align:center;padding:1rem;">Drivers</a></li>
  </ul>
</div>
{% endblock %}
