{% comment %}Expects: weeks_param, weeks_form_action (GET URL for this page).{% endcomment %}
<h2 class="rider-home-section-title" style="margin-top:1.25rem;">Time window</h2>
<p class="muted" style="margin:0 0 0.5rem;font-size:0.92rem;">
  Tables use the last <strong>N</strong> Monday-based weeks, ending on the <strong>previous</strong> completed week (not the week still in progress).
</p>
<form method="get" action="{{ weeks_form_action }}" class="report-week-filter" style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
  <label for="id-weeks">Weeks</label>
  <input type="number" name="weeks" id="id-weeks" min="1" max="52" value="{{ weeks_param }}" class="report-week-filter__input" style="max-width:5rem;">
  <button type="submit" class="btn-dash btn-dash-primary">Apply</button>
</form>
<p class="muted" style="margin-top:0.65rem;">Selected period: <strong>{{ window_range_label }}</strong></p>
